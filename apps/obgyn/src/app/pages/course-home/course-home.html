<div class="page">
  <header class="topbar no-print">
    <a class="topbar__brand" href="../">
      <span class="topbar__logo">✦</span>
      StudyHub
    </a>
    <lib-theme-toggle />
  </header>

  <main class="home">
    <div class="home__intro">
      <p class="home__eyebrow">OBGYN · Obstetrics &amp; Gynecology</p>
      <h1 class="home__title">راهنمای مامایی و زنان</h1>
      <p class="home__sub">
        ۱۲ فصل، خلاصه‌شده و همراه با خودآزمایی، بر پایه‌ی متن کامل ویلیامز و جزوه‌ی
        دوره — برای مرور سریع پیش از امتحان یا مطالعه‌ی عمیق‌تر.
      </p>
    </div>

    <div class="home__grid">
      @for (c of chapters; track c.id) {
        <lib-course-card
          variant="flat"
          [titleFa]="c.titleFa"
          [titleEn]="c.titleEn"
          [subtitleFa]="c.summaryFa"
          [metaFa]="c.readingMinutes + ' دقیقه'"
          [badge]="'فصل ' + c.order"
          icon="📖"
          [href]="'chapters/' + c.id"
        />
      }
    </div>

    <div class="home__reference">
      <h2>مرجع</h2>
      <div class="home__reference-links">
        <a href="reference/key-numbers">اعداد کلیدی برای امتحان</a>
        <a href="reference/glossary">واژه‌نامه‌ی دوزبانه</a>
      </div>
    </div>
  </main>
</div>
