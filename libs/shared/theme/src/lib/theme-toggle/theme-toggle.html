<button
  type="button"
  class="theme-toggle no-print"
  (click)="toggle()"
  [attr.aria-label]="mode() === 'dark' ? 'روشن‌سازی حالت روز' : 'روشن‌سازی حالت شب'"
  [title]="mode() === 'dark' ? 'حالت روز' : 'حالت شب'"
>
  @if (mode() === 'dark') {
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <circle cx="12" cy="12" r="4.2" />
      <path
        stroke-linecap="round"
        d="M12 2.5v2.2M12 19.3v2.2M21.5 12h-2.2M4.7 12H2.5M18.4 5.6l-1.55 1.55M7.15 16.85 5.6 18.4M18.4 18.4l-1.55-1.55M7.15 7.15 5.6 5.6"
      />
    </svg>
  } @else {
    <svg viewBox="0 0 24 24" fill="currentColor">
      <path
        d="M20.6 15.2A8.9 8.9 0 0 1 8.8 3.4a.7.7 0 0 0-.9-.9A9.9 9.9 0 1 0 21.5 16.1a.7.7 0 0 0-.9-.9Z"
      />
    </svg>
  }
</button>
